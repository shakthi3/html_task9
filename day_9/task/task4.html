<!doctype html>
<html>
  <head>
    <title>Unique Margin Styling</title>

    <style>
      body {
        background-color: #1e1e2f;
        font-family: Verdana, sans-serif;
      }

      .box {
        width: 350px;
        height: 180px;
        background-color: #232d2b;
        color: #ffeaa7;
        font-size: 28px;
        font-family: "Courier New", monospace;
        font-weight: bold;
        text-align: center;
        /* border: 7px groove #6c5ce7; */
        border: 7px solid #6c5ce7;
        padding: 40px;
        margin: 100px auto;
        border-radius: 30px;
        box-shadow: 10px 10px 20px #000000;
      }
    </style>
  </head>

  <body>
    <!-- 4. margin: space outside the box. -->
    <div class="box">Margin Creates Space Outside the Box</div>
  </body>
</html>
