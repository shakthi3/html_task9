<!doctype html>
<html>
  <head>
    <title>Styled Box</title>

    <style>
      .box {
        width: 300px;
        height: 180px;
        background-color: orange;
        color: white;

        border: 5px dashed darkred;
        padding: 30px;

        margin: 50px auto;
        border-radius: 20px;

        font-size: 24px;
        font-family: Arial, sans-serif;
        text-align: center;

        box-shadow: 5px 5px 15px gray;
      }
    </style>
  </head>

  <body>
    <!-- 2. Inside the .box, place some text content. -->

    <div class="box">This is a colorful CSS Box</div>
  </body>
</html>
