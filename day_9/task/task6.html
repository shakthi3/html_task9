<!doctype html>
<html>
  <head>
    <title>Padding Example</title>

    <style>
      body {
        background-color: #0f172a;
      }

      .box {
        width: 360px;
        height: 190px;
        background-color: #ff7f50;
        color: #2d3436;
        font-size: 29px;
        font-family: sans-serif;
        font-weight: bold;
        text-align: center;
        /* border: 9px ridge #1abc9c; */
        border: 9px solid #1abc9c;
        padding: 45px;
        margin: 85px auto;
        border-radius: 35px;
        box-shadow: 9px 9px 22px #111827;
      }
    </style>
  </head>

  <body>
    <!-- 6. padding: space inside the border, around the content. -->
    <div class="box">Padding Adds Space Inside the Border</div>
  </body>
</html>
