<!doctype html>
<html>
  <head>
    <title>CSS Box Model</title>

    <style>
      .box {
        width: 280px;
        height: 180px;
        background-color: lightgreen;
        color: darkblue;
        font-size: 22px;
        text-align: center;
        border: 6px solid purple;
        padding: 25px;
        margin: 40px auto;
        border-radius: 15px;
        box-shadow: 4px 4px 12px gray;
      }
    </style>
  </head>

  <body>
    <!-- 3. Style the .box to clearly show: -->

    <div class="box">CSS Box Model is Awesome</div>
  </body>
</html>
