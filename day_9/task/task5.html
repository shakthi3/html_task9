<!doctype html>
<html>
  <head>
    <title>Border Example</title>

    <style>
      body {
        background-color: #fff5e6;
        font-family: Tahoma, sans-serif;
      }

      .box {
        width: 340px;
        height: 170px;
        background-color: #8e44ad;
        color: #f9e79f;
        font-size: 27px;
        font-family: "Lucida Handwriting", cursive;
        text-align: center;
        border: 8px dotted #00cec9;
        padding: 35px;
        margin: 90px auto;
        border-radius: 18px;
        box-shadow: 7px 7px 18px gray;
      }
    </style>
  </head>

  <body>
    <!-- 5. border: a visible outline. -->
    <div class="box">Border Creates a Visible Outline</div>
  </body>
</html>
