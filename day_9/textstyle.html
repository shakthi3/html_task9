<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      p {
        font-size: 20px;
        text-transform: capitalize;
        font-weight: bold;
        font-style: italic;
        text-align: justify;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        /* three dot will come at the last */
        text-shadow: 3px 3px 5px;
        letter-spacing: 2px;
        word-spacing: 5px;
        line-height: 2.5;
      }
      span {
        text-decoration: underline yellow;
      }
      a {
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <p>This the<span> Paragraph</span></p>
    <a href="#">Home</a>
    <p>
      Lorem ipsum dolor sit amet consectetur adipisicing elit. Adipisci, nulla
      dicta! Alias, assumenda ducimus unde corporis illum explicabo nam id esse
      ipsum doloribus sunt itaque sed dolore, eligendi cupiditate
      necessitatibus.
    </p>
  </body>
</html>
